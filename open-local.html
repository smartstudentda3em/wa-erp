<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>WhatsApp ERP — تشغيل محلي</title>
  <!-- تحويل تلقائي إلى الرابط المحلي بعد 3 ثوانٍ (يعمل حتى لو تعطّل الجافاسكربت) -->
  <meta http-equiv="refresh" content="3; url=http://localhost:8001" />
  <style>
    :root { --brand:#25D366; --brand-dark:#128C7E; --ink:#0b141a; --muted:#667781; }
    * { box-sizing: border-box; }
    body {
      margin: 0; min-height: 100vh; display: flex; align-items: center; justify-content: center;
      font-family: "Segoe UI", Tahoma, system-ui, sans-serif;
      background: linear-gradient(135deg, #e9f9ef 0%, #d5f3e3 100%); color: var(--ink);
    }
    .card {
      background: #fff; width: 100%; max-width: 380px; margin: 20px; padding: 40px 32px;
      border-radius: 20px; box-shadow: 0 20px 50px rgba(18,140,126,.18); text-align: center;
    }
    .logo {
      width: 72px; height: 72px; margin: 0 auto 18px; border-radius: 18px;
      background: linear-gradient(135deg, var(--brand), var(--brand-dark));
      display: flex; align-items: center; justify-content: center;
      box-shadow: 0 8px 20px rgba(37,211,102,.35);
    }
    .logo svg { width: 40px; height: 40px; fill: #fff; }
    h1 { margin: 0 0 4px; font-size: 22px; color: var(--brand-dark); }
    p  { margin: 0 0 24px; font-size: 14px; color: var(--muted); }
    .btn {
      display: block; width: 100%; padding: 14px; border: 0; border-radius: 12px;
      background: var(--brand); color: #fff; font-size: 16px; font-weight: 700;
      text-decoration: none; cursor: pointer; transition: background .2s, transform .1s;
    }
    .btn:hover { background: var(--brand-dark); }
    .btn:active { transform: scale(.98); }
    .url { margin-top: 16px; font-size: 12px; color: var(--muted); direction: ltr; word-break: break-all; }
    .spin {
      margin: 18px auto 0; width: 22px; height: 22px; border: 3px solid #dbeee5;
      border-top-color: var(--brand); border-radius: 50%; animation: r 1s linear infinite;
    }
    @keyframes r { to { transform: rotate(360deg); } }
  </style>
</head>
<body>
  <main class="card">
    <div class="logo" aria-hidden="true">
      <svg viewBox="0 0 24 24"><path d="M12 2a10 10 0 0 0-8.6 15.1L2 22l5-1.3A10 10 0 1 0 12 2zm0 18a8 8 0 0 1-4.1-1.1l-.3-.2-3 .8.8-2.9-.2-.3A8 8 0 1 1 12 20zm4.4-5.6c-.2-.1-1.4-.7-1.6-.8s-.4-.1-.5.1-.6.8-.8 1-.3.2-.5.1a6.6 6.6 0 0 1-1.9-1.2 7.3 7.3 0 0 1-1.4-1.7c-.1-.2 0-.4.1-.5l.4-.4.2-.4a.4.4 0 0 0 0-.4l-.8-1.9c-.2-.5-.4-.4-.5-.4h-.5a.9.9 0 0 0-.7.3A2.8 2.8 0 0 0 6.5 10a4.9 4.9 0 0 0 1 2.6 11.2 11.2 0 0 0 4.3 3.8c.6.3 1.1.4 1.5.5a3.6 3.6 0 0 0 1.6.1 2.7 2.7 0 0 0 1.8-1.2 2.2 2.2 0 0 0 .1-1.2c0-.1-.2-.2-.4-.3z"/></svg>
    </div>
    <h1>WhatsApp ERP</h1>
    <p>جارٍ فتح البرنامج على الخادم المحلي…</p>
    <a class="btn" href="http://localhost:8001">فتح البرنامج الآن</a>
    <div class="spin" aria-hidden="true"></div>
    <div class="url">http://localhost:8001</div>
  </main>
  <script>
    // تحويل فوري إن كان الجافاسكربت مفعّلًا (أسرع من الـ meta refresh)
    setTimeout(function () { window.location.href = 'http://localhost:8001'; }, 400);
  </script>
</body>
</html>
